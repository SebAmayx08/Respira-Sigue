spring.application.name=respira-y-sigue

# --- Base de datos (MySQL) ---
# Los valores se leen de variables de entorno. Si no existen, se usan los valores por defecto locales.
# La base de datos se crea sola la primera vez (createDatabaseIfNotExist=true).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/respira_y_sigue?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Web ---
# Permite PUT y DELETE desde formularios HTML
spring.mvc.hiddenmethod.filter.enabled=true
# Caché de Thymeleaf desactivada en desarrollo
spring.thymeleaf.cache=false
