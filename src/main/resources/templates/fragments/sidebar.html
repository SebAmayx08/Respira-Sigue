<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar__brand">Respira y Sigue</div>

    <nav class="sidebar__nav">
        <a th:href="@{/inicio}"
           th:classappend="${active == 'inicio'} ? 'active'">Inicio</a>

        <a th:href="@{/ejercicios}"
           th:classappend="${active == 'ejercicios'} ? 'active'">Ejercicios</a>

        <a th:href="@{/recursos}"
           th:classappend="${active == 'recursos'} ? 'active'">Recursos</a>

        <a th:href="@{/recordatorios}"
           th:classappend="${active == 'recordatorios'} ? 'active'">Recordatorios</a>

        <a th:href="@{/test-emocional}"
           th:classappend="${active == 'test'} ? 'active'">Test emocional</a>

        <a th:href="@{/perfil}"
           th:classappend="${active == 'perfil'} ? 'active'">Perfil</a>
    </nav>

    <form th:action="@{/logout}" method="post" class="sidebar__logout">
        <button type="submit">Cerrar sesión</button>
    </form>
</aside>

</body>
</html>
